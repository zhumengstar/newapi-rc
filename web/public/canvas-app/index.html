<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="一个无限画布创作工具" />
        <link rel="icon" href="/canvas-app/logo.svg" />
        <title>无限画布</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
        <script>
            (function() {
                function getSafeDefaultBaseUrl() {
                    if (window.location.hostname === "super.muling.store") {
                        return window.location.origin ? (window.location.origin + "/v1") : "/v1";
                    }
                    return "https://super.muling.store/v1";
                }

                function sanitizeBaseUrl(url) {
                    if (!url) return getSafeDefaultBaseUrl();
                    var u = String(url).trim();
                    var isHttps = window.location.protocol === "https:";
                    // 彻底清除 147.124.216.251 裸 IP、3000/18331 端口或在 HTTPS 下的 http://，防止 Mixed Content 阻断与 IP 泄露
                    if (
                        u.indexOf("147.124.216.251") !== -1 ||
                        u.indexOf(":3000") !== -1 ||
                        u.indexOf(":18331") !== -1 ||
                        (isHttps && u.indexOf("http://") === 0)
                    ) {
                        return getSafeDefaultBaseUrl();
                    }
                    return u;
                }

                function cleanLegacyConfig() {
                    try {
                        var storeKey = "infinite-canvas:ai_config_store";
                        var raw = localStorage.getItem(storeKey);
                        if (!raw) return;
                        var data = JSON.parse(raw);
                        var changed = false;
                        var safeDefault = getSafeDefaultBaseUrl();
                        if (data && data.state && data.state.config) {
                            var cfg = data.state.config;
                            if (cfg.baseUrl) {
                                var cleaned = sanitizeBaseUrl(cfg.baseUrl);
                                if (cleaned !== cfg.baseUrl) {
                                    cfg.baseUrl = cleaned;
                                    changed = true;
                                }
                            }
                            if (Array.isArray(cfg.channels)) {
                                for (var i = 0; i < cfg.channels.length; i++) {
                                    var ch = cfg.channels[i];
                                    if (ch && ch.baseUrl) {
                                        var chCleaned = sanitizeBaseUrl(ch.baseUrl);
                                        if (chCleaned !== ch.baseUrl) {
                                            ch.baseUrl = chCleaned;
                                            changed = true;
                                        }
                                    }
                                }
                            }
                        }
                        if (changed) {
                            localStorage.setItem(storeKey, JSON.stringify(data));
                        }
                    } catch (e) {}
                }

                // 启动即刻清洗本地已存储的脏配置
                cleanLegacyConfig();

                function syncConfig(baseUrl, apiKey, channelName) {
                    var safeUrl = sanitizeBaseUrl(baseUrl);
                    if (!safeUrl && !apiKey) return;
                    try {
                        var storeKey = "infinite-canvas:ai_config_store";
                        var raw = localStorage.getItem(storeKey);
                        var data = raw ? JSON.parse(raw) : {};
                        if (!data.state) data.state = {};
                        if (!data.state.config) data.state.config = {};
                        var cfg = data.state.config;
                        if (safeUrl) cfg.baseUrl = safeUrl;
                        if (apiKey) cfg.apiKey = apiKey;
                        if (!Array.isArray(cfg.channels)) cfg.channels = [];

                        // 自动纠正旧渠道地址为安全专线地址
                        for (var cIdx = 0; cIdx < cfg.channels.length; cIdx++) {
                            var existingCh = cfg.channels[cIdx];
                            if (existingCh && existingCh.baseUrl) {
                                existingCh.baseUrl = sanitizeBaseUrl(existingCh.baseUrl);
                            }
                        }

                        var found = false;
                        var targetName = (channelName || "").trim();
                        if (targetName) {
                            for (var i = 0; i < cfg.channels.length; i++) {
                                var ch = cfg.channels[i];
                                if (ch && ch.name && ch.name.trim() === targetName) {
                                    if (safeUrl) ch.baseUrl = safeUrl;
                                    if (apiKey) ch.apiKey = apiKey;
                                    found = true;
                                    break;
                                }
                            }
                        } else {
                            for (var i = 0; i < cfg.channels.length; i++) {
                                var ch = cfg.channels[i];
                                if (ch && ch.baseUrl === safeUrl) {
                                    if (apiKey) ch.apiKey = apiKey;
                                    found = true;
                                    break;
                                }
                            }
                        }
                        if (!found && safeUrl) {
                            cfg.channels.unshift({
                                id: "chan_" + Date.now(),
                                name: targetName || "专线通道",
                                baseUrl: safeUrl,
                                apiKey: apiKey || "",
                                apiFormat: "openai",
                                models: []
                            });
                        }
                        localStorage.setItem(storeKey, JSON.stringify(data));
                    } catch (e) {}
                }

                try {
                    var sp = new URLSearchParams(window.location.search);
                    var b = sp.get("baseUrl") || sp.get("baseurl");
                    var k = sp.get("apiKey") || sp.get("apikey");
                    var c = sp.get("channelName") || sp.get("channelname");
                    if (b || k) syncConfig(b, k, c);
                } catch (e) {}

                window.addEventListener("message", function(event) {
                    var d = event.data;
                    if (!d || typeof d !== "object") return;
                    if (d.type === "NEWAPI_CANVAS_CONFIG") {
                        syncConfig(d.baseUrl, d.apiKey, d.channelName);
                    }
                });
            })();
        </script>
      <script type="module" crossorigin src="/canvas-app/static/index-CypYWAoo.js"></script>
      <link rel="stylesheet" crossorigin href="/canvas-app/static/index-qzbMtoLF.css">
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/canvas-app/config.js"></script>
    </body>
</html>
